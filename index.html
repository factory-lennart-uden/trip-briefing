:root {
  --accent: #ff5a00;
  --bg: #000000;
  --bg-surface: #151311;
  --border: #38322f;
  --text-primary: #ffffff;
  --text-100: #998f89;
  --text-300: #998f89;
  --text-400: #80756f;
  --text-500: #80756f;
  --error: #d72d17;
  --radius: 4px;
  --sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  background: var(--bg);
  color: var(--text-100);
  font-family: var(--sans);
  font-weight: 400;
  font-size: 15px;
  line-height: 1.6;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
[hidden] { display: none !important; }
html:not(.js) .js-only { display: none !important; }
a { color: inherit; text-decoration: none; }
a.link, .prose a { color: var(--accent); }
a.link:hover, .prose a:hover { text-decoration: underline; }

/* Type roles */
.eyebrow, .label {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.4;
  text-transform: uppercase;
  color: var(--text-500);
}
.eyebrow { margin: 0 0 12px; }
.label { margin: 0 0 6px; display: block; }
h1, .page-title {
  font-weight: 400;
  font-size: 28px;
  line-height: 1.15;
  color: var(--text-primary);
  margin: 0 0 10px;
  text-wrap: balance;
}
h3 {
  font-weight: 400;
  font-size: 20px;
  line-height: 1.25;
  color: var(--text-primary);
  margin: 36px 0 12px;
  text-wrap: balance;
}
.subtitle { font-size: 18px; line-height: 1.45; color: var(--text-300); margin: 0 0 8px; }
.muted { color: var(--text-400); }

/* Top bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(0, 0, 0, 0.94);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding-top: env(safe-area-inset-top);
}
.topbar-inner { max-width: 760px; margin: 0 auto; padding: 14px 16px 0; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: block; width: 96px; height: 15px; }
.logo svg { width: 100%; height: 100%; display: block; }
.trip-tag { font-family: var(--mono); font-size: 11px; text-transform: uppercase; color: var(--text-500); }
.tabs { display: flex; gap: 22px; margin-top: 8px; }
.tab {
  font-family: var(--mono);
  font-size: 12px;
  text-transform: uppercase;
  color: var(--text-400);
  padding: 10px 0 9px;
  border-bottom: 1px solid transparent;
}
.tab:hover { color: var(--text-primary); }
.tab.active { color: var(--text-primary); border-bottom-color: var(--accent); }
.search {
  display: block;
  width: 100%;
  margin: 2px 0 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  font: inherit;
  font-size: 16px;
  padding: 8px 12px;
  -webkit-appearance: none;
  appearance: none;
}
.search::placeholder { color: var(--text-500); }
.search:focus, .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--text-400); }

main { max-width: 760px; margin: 0 auto; padding: 24px 16px 96px; }

/* Pages: with JS one page is visible; without JS all pages stack with anchors */
.page { scroll-margin-top: 140px; }
html.js .page { display: none; }
html.js .page.active { display: block; }
html:not(.js) .page { padding-bottom: 40px; margin-bottom: 40px; border-bottom: 1px solid var(--border); }

.back {
  display: inline-block;
  font-family: var(--mono);
  font-size: 12px;
  text-transform: uppercase;
  color: var(--text-400);
  margin: 0 0 18px;
}
.back:hover { color: var(--text-primary); }

/* Hero + stats */
.hero { margin-bottom: 8px; }
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin: 20px 0;
}
.stat { background: var(--bg-surface); padding: 12px; }
.stat-value { font-size: 26px; line-height: 1.05; color: var(--text-primary); }
.stat-label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; color: var(--text-400); margin-top: 6px; }

/* Schedule */
.day { margin-top: 32px; }
.day-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
  margin-bottom: 4px;
}
.day-title { color: var(--text-primary); font-size: 18px; }
.day-cities { font-family: var(--mono); font-size: 11px; text-transform: uppercase; color: var(--text-500); text-align: right; }

.item {
  display: grid;
  grid-template-columns: 52px 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 12px 0;
}
.item + .item.travel, .item.travel + .item.travel { border-top: 1px solid var(--border); }
.item.meeting {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 12px;
  margin: 8px 0;
}
.item.meeting + .item.travel { border-top: 0; }
a.item:hover, a.row:hover { border-color: var(--text-400); }
.time { font-family: var(--mono); font-size: 13px; line-height: 1.5; color: var(--text-primary); }
.time .end { display: block; color: var(--text-500); }
.item .t, .row .t { display: block; color: var(--text-primary); font-size: 16px; line-height: 1.35; }
.item .meta, .row .meta { display: block; font-size: 13px; line-height: 1.45; color: var(--text-300); margin-top: 3px; }
.item.travel .t { font-size: 14px; color: var(--text-100); }
.item.travel .time { color: var(--text-400); }
.item.travel .meta { color: var(--text-500); }
.item.current { border-color: var(--text-400); }
.chev { color: var(--text-500); font-size: 20px; line-height: 1; align-self: center; }

/* Rows (accounts, people) */
.list { display: grid; gap: 8px; }
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
}
.row .body { flex: 1; min-width: 0; }
.group-title { margin: 28px 0 10px; }
.group-title:first-of-type { margin-top: 8px; }
.avatar {
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg);
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text-primary);
}
.avatar.square { border-radius: var(--radius); }
.avatar.lg { width: 56px; height: 56px; font-size: 18px; }
.head { display: flex; gap: 14px; align-items: center; margin-bottom: 4px; }
.head .page-title { margin: 0; }
.pill {
  flex: none;
  display: inline-block;
  border: 1px solid var(--border);
  color: var(--text-400);
  padding: 2px 10px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  white-space: nowrap;
}

/* Facts grid */
.facts {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin: 20px 0;
}
.facts > div { background: var(--bg-surface); padding: 10px 12px; min-width: 0; }
.facts dt { margin-bottom: 2px; }
.facts dd { color: var(--text-primary); font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }

/* Long text */
.prose p { margin: 0 0 10px; max-width: 68ch; text-wrap: pretty; }
.prose ul { margin: 0 0 10px; padding-left: 18px; max-width: 68ch; }
.prose li { margin-bottom: 6px; }
.prose li::marker { color: var(--text-500); }
.empty {
  font-family: var(--mono);
  font-size: 12px;
  text-transform: uppercase;
  color: var(--text-500);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin: 16px 0;
}

/* Footer */
.footer {
  margin-top: 56px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px 16px;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  color: var(--text-500);
}
.linkbtn {
  background: none;
  border: 0;
  font: inherit;
  text-transform: inherit;
  color: var(--text-400);
  cursor: pointer;
  padding: 0;
}
.linkbtn:hover { color: var(--accent); }

/* Editor */
.btn {
  font-family: var(--mono);
  font-size: 12px;
  text-transform: uppercase;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-primary);
  padding: 8px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--text-400); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #000; }
.btn.danger { color: var(--error); border-color: var(--error); }
.actions-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 8px; }
.danger-zone { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); }
.hint { font-size: 13px; color: var(--text-400); margin: 0 0 20px; max-width: 68ch; }
.field { display: block; margin: 0 0 14px; min-width: 0; }
.field input, .field textarea, .field select {
  display: block;
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  font: inherit;
  font-size: 16px;
  line-height: 1.5;
  padding: 9px 12px;
  color-scheme: dark;
}
.field textarea { min-height: 104px; resize: vertical; }
.grid2, .grid3 { display: grid; gap: 0 12px; grid-template-columns: 1fr; }
.check-group { margin-bottom: 12px; }
.check { display: flex; gap: 10px; align-items: center; padding: 6px 0; color: var(--text-primary); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.editbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  background: var(--bg-surface);
  border-top: 1px solid var(--border);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
}
.editbar-inner { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.editbar .label { margin: 0; }
.editbar .actions { display: flex; flex-wrap: wrap; gap: 6px; }
body.editing main { padding-bottom: 200px; }

/* Password lock (protected build) */
body.locked .tabs, body.locked .search { display: none; }
.lock { max-width: 420px; margin: 40px auto 0; }
.lock .page-title { margin-bottom: 20px; }
.lock .check { margin: 4px 0 8px; }
.lock .hint { margin-top: 12px; min-height: 1.5em; }
.btn:disabled { opacity: 0.5; cursor: default; }

@media (min-width: 560px) {
  .grid2 { grid-template-columns: 1fr 1fr; }
  .grid3 { grid-template-columns: 1.4fr 1fr 1fr; }
}
@media (min-width: 680px) {
  h1, .page-title { font-size: 40px; line-height: 1.15; }
  main { padding-top: 36px; }
  .stat-value { font-size: 32px; }
  .item { grid-template-columns: 64px 1fr auto; }
}
@media (max-width: 400px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .row .pill { display: none; }
}
@media print {
  .topbar, .search, .editbar, .footer .linkbtn { display: none !important; }
  html.js .page { display: block; }
}

</style>

<script>
(function (root) {
  'use strict';

  const STORAGE_KEY = 'factory-trip-briefing:draft:v1';
  // Built from parts so the HTML parser never sees a comment opener inside this script.

  const PAGES_END = '<' + '!--PAGES:END--' + '>';

  const TRIP_SHORT = [['title', 'Trip title'], ['traveler', 'Traveler'], ['dateLabel', 'Dates'], ['preparedBy', 'Prepared by']];
  const TRIP_LONG = [['summary', 'Trip overview'], ['keyContacts', 'Key contacts on the ground']];
  const ACCOUNT_SHORT = [
    ['industry', 'Industry'], ['hq', 'Headquarters'], ['unit', 'Business unit / team'], ['employees', 'Employees'],

  const ACCOUNT_LONG = [

    ['opportunity', 'Opportunity and deal status'], ['history', 'Relationship history'], ['talkingPoints', 'Talking points'],

  ];
  const PERSON_SHORT = [
    ['title', 'Title'], ['department', 'Department'], ['dealRole', 'Role in deal'], ['location', 'Location'],
    ['email', 'Email', 'email'], ['phone', 'Phone', 'tel'], ['linkedin', 'LinkedIn', 'url']
  ];
  const PERSON_LONG = [
    ['background', 'Background'], ['priorities', 'Priorities and pain points'], ['relationship', 'History with Factory'],
    ['talkingPoints', 'Talking points and questions to ask'], ['personal', 'Personal notes and icebreakers'], ['notes', 'Notes']
  ];
  const MEETING_LONG = [
    ['objective', 'Meeting objective'], ['context', 'Context'], ['agenda', 'Agenda'], ['talkingPoints', 'Key messages'],
    ['desiredOutcome', 'Desired outcome and ask'], ['logisticsNotes', 'Logistics notes'], ['notes', 'Notes']
  ];
  const DEAL_ROLES = ['Economic buyer', 'Champion', 'Technical evaluator', 'Influencer', 'Host', 'Blocker', 'Unknown'];
  const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MO = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  // ---------- helpers ----------
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ESC[c]); }
  function filled(v) { return String(v == null ? '' : v).trim() !== ''; }
  function byId(arr, id) { return (arr || []).find((x) => x.id === id); }
  function uniq(arr) { return arr.filter((x, i) => arr.indexOf(x) === i); }
  function initials(name) {
    const s = String(name || '').trim().split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
    return s || '?';
  }
  function slug(s) { return String(s || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32); }
  function linkify(escaped) {
    return escaped.replace(/\bhttps?:\/\/[^\s<]+[^\s<.,;:!?)\]]/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  }
  function rich(text) {
    const out = [];
    let para = [];
    let list = [];
    const flushP = () => { if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; } };
    const flushL = () => { if (list.length) { out.push('<ul>' + list.map((x) => '<li>' + x + '</li>').join('') + '</ul>'); list = []; } };
    for (const raw of String(text || '').split('\n')) {
      const line = raw.trim();
      if (!line) { flushP(); flushL(); continue; }
      const m = line.match(/^[-*\u2022]\s+(.*)$/);
      if (m) { flushP(); list.push(linkify(esc(m[1]))); } else { flushL(); para.push(linkify(esc(line))); }
    }
    flushP(); flushL();
    return out.join('');
  }
  function parseDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null;
  }
  function dayShort(s) { const d = parseDate(s); return d ? `${WD[d.getUTCDay()].slice(0, 3)} ${d.getUTCDate()} ${MO[d.getUTCMonth()].slice(0, 3)}` : 'Date to be set'; }
  function dayLong(s) { const d = parseDate(s); return d ? `${WD[d.getUTCDay()]}, ${d.getUTCDate()} ${MO[d.getUTCMonth()]}` : 'Date to be set'; }
  function timeRange(i) { return i.start ? (i.end ? `${i.start}\u2013${i.end}` : i.start) : 'Time to be set'; }
  function stamp(iso) { const d = new Date(iso); return isNaN(d) ? '' : `${d.getDate()} ${MO[d.getMonth()].slice(0, 3)} ${d.getFullYear()}`; }
  function mapsUrl(q) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }
  function sortKey(i) { return (i.date || '9999-99-99') + (i.start || '99:99'); }
  function sortedItems(D) { return D.items.slice().sort((a, b) => sortKey(a).localeCompare(sortKey(b))); }
  function meetingsOf(D) { return sortedItems(D).filter((i) => i.kind === 'meeting'); }
  function accountOrder(D) {
    const ms = meetingsOf(D);
    const first = (a) => { const m = ms.find((x) => x.accountId === a.id); return m ? sortKey(m) : 'z'; };
    return D.accounts.slice().sort((a, b) => first(a).localeCompare(first(b)) || String(a.name).localeCompare(String(b.name)));
  }
  function groupPeople(D, firstAccountId) {
    const accs = accountOrder(D);
    if (firstAccountId) accs.sort((a, b) => (b.id === firstAccountId) - (a.id === firstAccountId));
    const groups = accs.map((a) => ({ name: a.name || 'Untitled account', id: a.id, people: D.people.filter((p) => p.accountId === a.id) }))
      .filter((g) => g.people.length);
    const orphans = D.people.filter((p) => !byId(D.accounts, p.accountId));
    if (orphans.length) groups.push({ name: 'No account', id: '', people: orphans });
    return groups;
  }

  // ---------- view rendering (pure; also runs at build time in Node) ----------
  function valueHTML(v, kind) {
    const s = String(v).trim();
    if (kind === 'url') {
      const href = /^https?:\/\//i.test(s) ? s : 'https://' + s;
      return `<a class="link" href="${esc(href)}" target="_blank" rel="noopener">${esc(s.replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, ''))}</a>`;
    }
    if (kind === 'email') return `<a class="link" href="mailto:${esc(s)}">${esc(s)}</a>`;
    if (kind === 'tel') return `<a class="link" href="tel:${esc(s.replace(/[^\d+]/g, ''))}">${esc(s)}</a>`;
    return esc(s);
  }
  function factsGrid(cells) {
    const c = cells.filter(Boolean);
    return c.length ? `<dl class="facts">${c.map(([l, h]) => `<div><dt class="label">${esc(l)}</dt><dd>${h}</dd></div>`).join('')}</dl>` : '';
  }
  function factsFrom(obj, defs) {
    return factsGrid(defs.filter(([k]) => filled(obj[k])).map(([k, l, kind]) => [l, valueHTML(obj[k], kind)]));
  }
  function longSections(obj, defs) {
    return defs.filter(([k]) => filled(obj[k]))
      .map(([k, l]) => `<section class="block"><h3>${esc(l)}</h3><div class="prose">${rich(obj[k])}</div></section>`).join('');
  }
  const EMPTY_NOTE = '<p class="empty">Briefing not added yet</p>';

  function meetingRow(D, m, opts) {
    opts = opts || {};
    const acc = byId(D.accounts, m.accountId);
    const n = (m.attendees || []).length;
    const meta = [opts.withDate && dayShort(m.date), acc && acc.name, m.city, n ? n + (n === 1 ? ' attendee' : ' attendees') : '']
      .filter(Boolean).join(' \u00b7 ');
    return `<a class="item meeting${opts.current ? ' current' : ''}" href="#meeting-${esc(m.id)}">` +
      `<span class="time">${esc(m.start || 'TBD')}${m.end ? `<span class="end">${esc(m.end)}</span>` : ''}</span>` +
      `<span class="body"><span class="t">${esc(m.title || 'Untitled meeting')}</span>${meta ? `<span class="meta">${esc(meta)}</span>` : ''}</span>` +
      `<span class="chev" aria-hidden="true">\u203a</span></a>`;
  }
  function travelRow(t, editMode) {
    const time = `<span class="time">${esc(t.start || 'TBD')}</span>`;
    if (editMode) {
      return `<a class="item travel" href="#travel-${esc(t.id)}">${time}<span class="body"><span class="t">${esc(t.title || 'Untitled travel')}</span>` +
        `${filled(t.detail) ? `<span class="meta">${esc(t.detail)}</span>` : ''}</span><span class="chev" aria-hidden="true">\u203a</span></a>`;
    }
    const meta = [filled(t.detail) && esc(t.detail), filled(t.address) && `<a class="link" href="${esc(mapsUrl(t.address))}" target="_blank" rel="noopener">Map</a>`]
      .filter(Boolean).join(' \u00b7 ');
    return `<div class="item travel">${time}<span class="body"><span class="t">${esc(t.title || 'Travel')}</span>${meta ? `<span class="meta">${meta}</span>` : ''}</span><span></span></div>`;
  }
  function personRow(D, p, opts) {
    opts = opts || {};
    const acc = byId(D.accounts, p.accountId);
    const meta = [p.title || p.department, opts.withAccount && acc && acc.name].filter((x) => x && filled(x)).join(' \u00b7 ');
    return `<a class="row" href="#person-${esc(p.id)}"><span class="avatar">${esc(initials(p.name))}</span>` +
      `<span class="body"><span class="t">${esc(p.name || 'Unnamed person')}</span>${meta ? `<span class="meta">${esc(meta)}</span>` : ''}</span>` +
      `${filled(p.dealRole) ? `<span class="pill">${esc(p.dealRole)}</span>` : ''}<span class="chev" aria-hidden="true">\u203a</span></a>`;
  }
  function accountRow(D, a) {
    const ms = meetingsOf(D).filter((m) => m.accountId === a.id);
    const ppl = D.people.filter((p) => p.accountId === a.id).length;
    const meta1 = [a.industry, a.hq].filter(filled).join(' \u00b7 ');
    const first = ms[0];
    const meta2 = [first && [dayShort(first.date), first.start, first.city].filter(filled).join(' \u00b7 '), ppl ? ppl + (ppl === 1 ? ' person' : ' people') : '']
      .filter(Boolean).join(' \u00b7 ');
    return `<a class="row" href="#account-${esc(a.id)}"><span class="avatar square">${esc(initials(a.name))}</span>` +
      `<span class="body"><span class="t">${esc(a.name || 'Untitled account')}</span>${meta1 ? `<span class="meta">${esc(meta1)}</span>` : ''}` +
      `${meta2 ? `<span class="meta">${esc(meta2)}</span>` : ''}</span><span class="chev" aria-hidden="true">\u203a</span></a>`;
  }
  function daysHTML(D, editMode) {
    const items = sortedItems(D);
    const dates = uniq(items.map((i) => i.date || ''));
    if (!dates.length) return '<p class="empty">No meetings yet</p>';
    return dates.map((date) => {
      const day = items.filter((i) => (i.date || '') === date);
      const cities = uniq(day.filter((i) => i.kind === 'meeting' && filled(i.city)).map((i) => i.city.trim()));
      return `<div class="day"><div class="day-head"><span class="day-title">${esc(dayLong(date))}</span>` +
        `<span class="day-cities">${esc(cities.join(' \u2192 '))}</span></div>` +
        day.map((i) => (i.kind === 'meeting' ? meetingRow(D, i) : travelRow(i, editMode))).join('') + '</div>';
    }).join('');
  }

  function pageSchedule(D) {
    const t = D.trip || {};
    const ms = meetingsOf(D);
    const accs = uniq(ms.map((m) => m.accountId).filter((id) => byId(D.accounts, id)));
    const ppl = uniq([].concat(...ms.map((m) => m.attendees || [])).filter((id) => byId(D.people, id)));
    const cities = uniq(ms.map((m) => (m.city || '').trim()).filter(Boolean));
    const stat = (v, l) => `<div class="stat"><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div>`;
    return `<section class="page" id="schedule"><div class="hero">` +
      `<p class="eyebrow">${esc([t.traveler, t.dateLabel].filter(filled).join(' \u00b7 '))}</p>` +
      `<h1>${esc(t.title || 'Trip briefing')}</h1>` +
      (cities.length ? `<p class="subtitle">${esc(cities.join(' \u00b7 '))}</p>` : '') +
      `<div class="stats">${stat(ms.length, 'Meetings')}${stat(accs.length, 'Accounts')}${stat(ppl.length, 'People')}${stat(cities.length, 'Cities')}</div>` +
      longSections(t, TRIP_LONG) + `</div>${daysHTML(D, false)}</section>`;
  }
  function pageAccounts(D) {
    const rows = accountOrder(D).map((a) => accountRow(D, a)).join('');
    return `<section class="page" id="accounts"><p class="eyebrow">${D.accounts.length} accounts</p><h2 class="page-title">Accounts</h2>` +
      (rows ? `<div class="list">${rows}</div>` : '<p class="empty">No accounts yet</p>') + '</section>';
  }
  function pagePeople(D) {
    const groups = groupPeople(D);
    return `<section class="page" id="people"><p class="eyebrow">${D.people.length} people</p><h2 class="page-title">People</h2>` +
      (groups.length ? groups.map((g) => `<p class="label group-title">${g.id ? `<a href="#account-${esc(g.id)}">${esc(g.name)}</a>` : esc(g.name)}</p>` +
        `<div class="list">${g.people.map((p) => personRow(D, p)).join('')}</div>`).join('') : '<p class="empty">No people yet</p>') + '</section>';
  }
  function pageMeeting(D, m) {
    const acc = byId(D.accounts, m.accountId);
    const ppl = (m.attendees || []).map((id) => byId(D.people, id)).filter(Boolean);
    const whereParts = [m.venue, m.address].filter(filled);
    const where = whereParts.length ? whereParts.map(esc).join('<br>') +
      `<br><a class="link" href="${esc(mapsUrl(whereParts.join(', ')))}" target="_blank" rel="noopener">Open map</a>` : '';
    const facts = factsGrid([
      ['When', `${esc(dayShort(m.date))}<br>${esc(timeRange(m))}`],
      where && ['Where', where],
      filled(m.meetingType) && ['Format', esc(m.meetingType)],
      filled(m.factoryTeam) && ['Factory team', esc(m.factoryTeam)]
    ]);
    const sameDay = sortedItems(D).filter((i) => i.date === m.date);
    const sub = [acc && `<a class="link" href="#account-${esc(acc.id)}">${esc(acc.name)}</a>`, filled(m.city) && esc(m.city)].filter(Boolean).join(' \u00b7 ');
    return `<section class="page" id="meeting-${esc(m.id)}"><a class="back" href="#schedule">\u2039 Schedule</a>` +
      `<p class="eyebrow">${esc(dayLong(m.date))} \u00b7 ${esc(timeRange(m))}</p><h2 class="page-title">${esc(m.title || 'Untitled meeting')}</h2>` +
      (sub ? `<p class="subtitle">${sub}</p>` : '') + facts +
      `<h3>Who you will meet</h3>` + (ppl.length ? `<div class="list">${ppl.map((p) => personRow(D, p, { withAccount: !acc || p.accountId !== acc.id })).join('')}</div>` : '<p class="empty">Attendees not added yet</p>') +
      (longSections(m, MEETING_LONG) || EMPTY_NOTE) +
      (sameDay.length > 1 ? `<h3>Rest of the day</h3>` + sameDay.map((i) => (i.kind === 'meeting' ? meetingRow(D, i, { current: i.id === m.id }) : travelRow(i, false))).join('') : '') +
      '</section>';
  }
  function pageAccount(D, a) {
    const ms = meetingsOf(D).filter((m) => m.accountId === a.id);
    const ppl = D.people.filter((p) => p.accountId === a.id);
    const sub = [a.industry, a.hq].filter(filled).map(esc).join(' \u00b7 ');
    return `<section class="page" id="account-${esc(a.id)}"><a class="back" href="#accounts">\u2039 Accounts</a>` +
      `<p class="eyebrow">Account</p><div class="head"><span class="avatar square lg">${esc(initials(a.name))}</span><h2 class="page-title">${esc(a.name || 'Untitled account')}</h2></div>` +
      (sub ? `<p class="subtitle">${sub}</p>` : '') +
      factsFrom(a, ACCOUNT_SHORT.filter(([k]) => k !== 'industry' && k !== 'hq')) +
      (ms.length ? `<h3>Meetings</h3>${ms.map((m) => meetingRow(D, m, { withDate: true })).join('')}` : '') +
      `<h3>People</h3>` + (ppl.length ? `<div class="list">${ppl.map((p) => personRow(D, p)).join('')}</div>` : '<p class="empty">No people added yet</p>') +
      (longSections(a, ACCOUNT_LONG) || EMPTY_NOTE) + '</section>';
  }
  function pagePerson(D, p) {
    const acc = byId(D.accounts, p.accountId);
    const ms = meetingsOf(D).filter((m) => (m.attendees || []).includes(p.id));
    const sub = [filled(p.title) && esc(p.title), acc && `<a class="link" href="#account-${esc(acc.id)}">${esc(acc.name)}</a>`].filter(Boolean).join(' \u00b7 ');
    return `<section class="page" id="person-${esc(p.id)}">` +
      (acc ? `<a class="back" href="#account-${esc(acc.id)}">\u2039 ${esc(acc.name)}</a>` : '<a class="back" href="#people">\u2039 People</a>') +
      `<p class="eyebrow">Person</p><div class="head"><span class="avatar lg">${esc(initials(p.name))}</span><h2 class="page-title">${esc(p.name || 'Unnamed person')}</h2></div>` +
      (sub ? `<p class="subtitle">${sub}</p>` : '') +
      factsFrom(p, PERSON_SHORT.filter(([k]) => k !== 'title')) +
      (ms.length ? `<h3>Meetings</h3>${ms.map((m) => meetingRow(D, m, { withDate: true })).join('')}` : '') +
      (longSections(p, PERSON_LONG) || EMPTY_NOTE) + '</section>';
  }
  function footerHTML(D, opts) {
    const t = D.trip || {};
    const when = D.meta && D.meta.updatedAt ? stamp(D.meta.updatedAt) : '';
    const left = [filled(t.preparedBy) && 'Prepared by ' + t.preparedBy, when && 'Updated ' + when].filter(Boolean).join(' \u00b7 ');
    const btn = opts && opts.protected
      ? '<button type="button" class="linkbtn js-only" data-action="lock">Lock</button>'
      : '<button type="button" class="linkbtn js-only" data-action="toggle-edit">Edit</button>';
    return `<footer class="footer"><span>${esc(left)}${opts && opts.draft ? ' \u00b7 includes local edits' : ''}</span>${btn}</footer>`;
  }
  function renderStaticPages(D, opts) {
    return pageSchedule(D) + pageAccounts(D) + pagePeople(D) +
      meetingsOf(D).map((m) => pageMeeting(D, m)).join('') +
      accountOrder(D).map((a) => pageAccount(D, a)).join('') +
      D.people.map((p) => pagePerson(D, p)).join('') + footerHTML(D, opts);
  }

  // ---------- editor rendering ----------
  const HINT = '<p class="hint">Changes save in this browser as you type. In long fields, put each paragraph on its own line, start a line with "- " for a bullet, and paste links as-is.</p>';
  function fieldHTML(type, id, key, label, value, opt) {
    opt = opt || {};
    const a = `data-e="${type}" data-id="${esc(id || '')}" data-k="${esc(key)}"`;
    let control;
    if (opt.long) control = `<textarea ${a} rows="4">${esc(value)}</textarea>`;
    else if (opt.options) control = `<select ${a}>${opt.options.map(([v, l]) => `<option value="${esc(v)}"${v === (value || '') ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    else control = `<input ${a} type="${opt.type || 'text'}" value="${esc(value)}"${opt.placeholder ? ` placeholder="${esc(opt.placeholder)}"` : ''}${opt.list ? ` list="${opt.list}"` : ''}>`;
    return `<label class="field"><span class="label">${esc(label)}</span>${control}</label>`;
  }
  function fieldsHTML(type, obj, defs, long) {
    return defs.map(([k, l, kind]) => fieldHTML(type, obj.id, k, l, obj[k], {
      long, type: kind === 'email' ? 'email' : kind === 'tel' ? 'tel' : kind === 'url' ? 'url' : 'text',
      list: k === 'dealRole' ? 'deal-roles' : ''
    })).join('');
  }
  function accountOptions(D) { return [['', 'No account']].concat(accountOrder(D).map((a) => [a.id, a.name || 'Untitled account'])); }
  function deleteBtn(type, id, label) {
    return `<div class="danger-zone"><button type="button" class="btn danger" data-action="delete" data-type="${type}" data-id="${esc(id)}">${esc(label)}</button></div>`;
  }
  function attendeeChecklist(D, m) {
    if (!D.people.length) return '<p class="empty">No people yet</p>';
    const set = new Set(m.attendees || []);
    return groupPeople(D, m.accountId).map((g) => `<div class="check-group"><p class="label">${esc(g.name)}</p>` +
      g.people.map((p) => `<label class="check"><input type="checkbox" data-attendee="${esc(m.id)}" value="${esc(p.id)}"${set.has(p.id) ? ' checked' : ''}>` +
        `<span>${esc(p.name || 'Unnamed person')}${filled(p.title) ? ` <span class="muted">\u00b7 ${esc(p.title)}</span>` : ''}</span></label>`).join('') + '</div>').join('');
  }
  function editSchedule(D) {
    return `<p class="eyebrow">Edit trip</p><h2 class="page-title">${esc(D.trip.title || 'Trip briefing')}</h2>${HINT}` +
      `<div class="grid2">${fieldsHTML('trip', D.trip, TRIP_SHORT)}</div>${fieldsHTML('trip', D.trip, TRIP_LONG, true)}` +
      `<h3>Schedule</h3><div class="actions-row"><button type="button" class="btn" data-action="add-meeting">+ Meeting</button>` +
      `<button type="button" class="btn" data-action="add-travel">+ Travel or logistics</button></div>${daysHTML(D, true)}`;
  }
  function editMeeting(D, m) {
    return `<a class="back" href="#schedule">\u2039 Schedule</a><p class="eyebrow">Edit meeting</p><h2 class="page-title">${esc(m.title || 'Untitled meeting')}</h2>${HINT}` +
      fieldHTML('meeting', m.id, 'title', 'Title', m.title) +
      `<div class="grid3">${fieldHTML('meeting', m.id, 'date', 'Date', m.date, { type: 'date' })}${fieldHTML('meeting', m.id, 'start', 'Start', m.start, { type: 'time' })}${fieldHTML('meeting', m.id, 'end', 'End', m.end, { type: 'time' })}</div>` +
      `<div class="grid2">${fieldHTML('meeting', m.id, 'city', 'City', m.city)}${fieldHTML('meeting', m.id, 'meetingType', 'Format', m.meetingType, { placeholder: 'In person, video, dinner' })}</div>` +
      fieldHTML('meeting', m.id, 'venue', 'Venue', m.venue) + fieldHTML('meeting', m.id, 'address', 'Address', m.address) +
      fieldHTML('meeting', m.id, 'accountId', 'Account', m.accountId, { options: accountOptions(D) }) +
      fieldHTML('meeting', m.id, 'factoryTeam', 'Factory team', m.factoryTeam, { placeholder: 'Matan Grinberg, Lennart Uden' }) +
      `<h3>Attendees</h3>${attendeeChecklist(D, m)}<div class="actions-row"><button type="button" class="btn" data-action="add-person" data-meeting="${esc(m.id)}">+ New person</button></div>` +
      `<h3>Briefing</h3>${fieldsHTML('meeting', m, MEETING_LONG, true)}` + deleteBtn('meeting', m.id, 'Delete meeting');
  }
  function editTravel(D, t) {
    return `<a class="back" href="#schedule">\u2039 Schedule</a><p class="eyebrow">Edit travel</p><h2 class="page-title">${esc(t.title || 'Travel')}</h2>` +
      fieldHTML('travel', t.id, 'title', 'Title', t.title) +
      `<div class="grid3">${fieldHTML('travel', t.id, 'date', 'Date', t.date, { type: 'date' })}${fieldHTML('travel', t.id, 'start', 'Start', t.start, { type: 'time' })}${fieldHTML('travel', t.id, 'end', 'End', t.end, { type: 'time' })}</div>` +
      fieldHTML('travel', t.id, 'detail', 'Detail', t.detail, { placeholder: 'Flight number, driver, duration' }) +
      fieldHTML('travel', t.id, 'address', 'Destination address (for the map link)', t.address) + deleteBtn('travel', t.id, 'Delete travel item');
  }
  function editAccount(D, a) {
    const ppl = D.people.filter((p) => p.accountId === a.id);
    return `<a class="back" href="#accounts">\u2039 Accounts</a><p class="eyebrow">Edit account</p><h2 class="page-title">${esc(a.name || 'Untitled account')}</h2>${HINT}` +
      fieldHTML('account', a.id, 'name', 'Name', a.name) + `<div class="grid2">${fieldsHTML('account', a, ACCOUNT_SHORT)}</div>` +
      `<h3>People</h3>${ppl.length ? `<div class="list">${ppl.map((p) => personRow(D, p)).join('')}</div>` : '<p class="empty">No people yet</p>'}` +
      `<div class="actions-row"><button type="button" class="btn" data-action="add-person" data-account="${esc(a.id)}">+ New person</button></div>` +
      `<h3>Briefing</h3>${fieldsHTML('account', a, ACCOUNT_LONG, true)}` + deleteBtn('account', a.id, 'Delete account');
  }
  function editPerson(D, p) {
    const ms = meetingsOf(D);
    return `<a class="back" href="#people">\u2039 People</a><p class="eyebrow">Edit person</p><h2 class="page-title">${esc(p.name || 'Unnamed person')}</h2>${HINT}` +
      `<datalist id="deal-roles">${DEAL_ROLES.map((r) => `<option value="${esc(r)}">`).join('')}</datalist>` +
      `<div class="grid2">${fieldHTML('person', p.id, 'name', 'Name', p.name)}${fieldHTML('person', p.id, 'accountId', 'Account', p.accountId, { options: accountOptions(D) })}</div>` +
      `<div class="grid2">${fieldsHTML('person', p, PERSON_SHORT)}</div>` +
      `<h3>Meetings</h3>` + (ms.length ? ms.map((m) => `<label class="check"><input type="checkbox" data-attendee="${esc(m.id)}" value="${esc(p.id)}"${(m.attendees || []).includes(p.id) ? ' checked' : ''}>` +
        `<span>${esc(m.title || 'Untitled meeting')} <span class="muted">\u00b7 ${esc(dayShort(m.date))} ${esc(m.start || '')}</span></span></label>`).join('') : '<p class="empty">No meetings yet</p>') +
      `<h3>Briefing</h3>${fieldsHTML('person', p, PERSON_LONG, true)}` + deleteBtn('person', p.id, 'Delete person');
  }
  function editAccounts(D) {
    return `<p class="eyebrow">Edit</p><h2 class="page-title">Accounts</h2><div class="actions-row"><button type="button" class="btn" data-action="add-account">+ Account</button></div>` +
      `<div class="list">${accountOrder(D).map((a) => accountRow(D, a)).join('')}</div>`;
  }
  function editPeople(D) {
    return `<p class="eyebrow">Edit</p><h2 class="page-title">People</h2><div class="actions-row"><button type="button" class="btn" data-action="add-person">+ Person</button></div>` +
      groupPeople(D).map((g) => `<p class="label group-title">${esc(g.name)}</p><div class="list">${g.people.map((p) => personRow(D, p)).join('')}</div>`).join('');
  }
  function renderEditor(D, r) {
    const notFound = editSchedule(D);
    if (r.type === 'meeting') { const m = byId(D.items, r.id); return m ? editMeeting(D, m) : notFound; }
    if (r.type === 'travel') { const t = byId(D.items, r.id); return t ? editTravel(D, t) : notFound; }
    if (r.type === 'account') { const a = byId(D.accounts, r.id); return a ? editAccount(D, a) : notFound; }
    if (r.type === 'person') { const p = byId(D.people, r.id); return p ? editPerson(D, p) : notFound; }
    if (r.type === 'accounts') return editAccounts(D);
    if (r.type === 'people') return editPeople(D);
    return notFound;
  }
  function renderSearch(D, q) {
    const has = (...vals) => vals.filter(Boolean).join(' ').toLowerCase().includes(q);
    const ms = meetingsOf(D).filter((m) => { const a = byId(D.accounts, m.accountId); return has(m.title, m.city, m.venue, a && a.name); });
    const as = accountOrder(D).filter((a) => has(a.name, a.industry, a.hq, a.unit));
    const ps = D.people.filter((p) => { const a = byId(D.accounts, p.accountId); return has(p.name, p.title, p.department, p.dealRole, a && a.name); });
    if (!ms.length && !as.length && !ps.length) return '<p class="empty">No matches</p>';
    return (ms.length ? `<p class="label group-title">Meetings</p>${ms.map((m) => meetingRow(D, m, { withDate: true })).join('')}` : '') +
      (as.length ? `<p class="label group-title">Accounts</p><div class="list">${as.map((a) => accountRow(D, a)).join('')}</div>` : '') +
      (ps.length ? `<p class="label group-title">People</p><div class="list">${ps.map((p) => personRow(D, p, { withAccount: true })).join('')}</div>` : '');
  }

  function safeJSON(D) { return JSON.stringify(D).replace(/</g, '\\u003c'); }

  root.TripApp = { renderStaticPages, safeJSON };

  // ---------- browser app ----------
  function boot(EMBEDDED, mode) {
    // Protected builds never write briefing data to local storage, and editing is disabled.
    const PROTECTED = mode === 'protected';
    const SHELL = document.documentElement.outerHTML;
    const pagesEl = document.getElementById('pages');
    const editorEl = document.getElementById('editor');
    const searchEl = document.getElementById('search-view');
    const editbar = document.getElementById('editbar');
    const qEl = document.getElementById('q');
    const fileEl = document.getElementById('import-file');

    let D = EMBEDDED;
    let usingDraft = false;
    let editing = false;
    let saveTimer = null;
    if (!PROTECTED) try {
      const draft = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      const embeddedAt = (EMBEDDED.meta && EMBEDDED.meta.updatedAt) || '';
      if (draft && draft.meta && draft.meta.updatedAt > embeddedAt) { D = draft; usingDraft = true; }
    } catch (err) { /* storage unavailable (e.g. private mode); the embedded snapshot is used */ }
    D.meta = D.meta || {};

    function parseHash() {
      let h = location.hash.replace(/^#\/?/, '');
      try { h = decodeURIComponent(h); } catch (err) { /* keep raw */ }
      h = h || 'schedule';
      const i = h.indexOf('-');
      return { hash: h, type: i < 0 ? h : h.slice(0, i), id: i < 0 ? '' : h.slice(i + 1) };
    }
    function tabFor(type) {
      return ({ accounts: 'accounts', account: 'accounts', people: 'people', person: 'people' })[type] || 'schedule';
    }
    function renderPages() { pagesEl.innerHTML = renderStaticPages(D, { draft: usingDraft, protected: PROTECTED }); }
    function applyRoute(scroll) {
      const r = parseHash();
      searchEl.hidden = true;
      document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === tabFor(r.type)));
      if (editing) {
        pagesEl.hidden = true;
        editorEl.hidden = false;
        editorEl.innerHTML = renderEditor(D, r);
      } else {
        editorEl.hidden = true;
        editorEl.innerHTML = '';
        pagesEl.hidden = false;
        let target = document.getElementById(r.hash);
        if (!target || !target.classList.contains('page')) target = document.getElementById('schedule');
        pagesEl.querySelectorAll('.page.active').forEach((p) => p.classList.remove('active'));
        if (target) target.classList.add('active');
      }
      if (scroll !== false) window.scrollTo(0, 0);
    }
    function navigate(hash) { if (location.hash === hash) applyRoute(); else location.hash = hash; }
    function setStatus(msg) { const s = editbar.querySelector('.status'); if (s) s.textContent = msg; }
    function saveNow() {
      clearTimeout(saveTimer);
      saveTimer = null;
      if (PROTECTED) return;
      D.meta.updatedAt = new Date().toISOString();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(D));
        usingDraft = true;
        setStatus('Editing \u00b7 saved in this browser');
      } catch (err) {
        setStatus('Editing \u00b7 could not save here, export before closing');
      }
    }
    function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
    function entity(type, id) {
      if (type === 'trip') return D.trip;
      if (type === 'meeting' || type === 'travel') return byId(D.items, id);
      if (type === 'account') return byId(D.accounts, id);
      if (type === 'person') return byId(D.people, id);
      return null;
    }
    function newId(prefix, name) { return `${prefix}-${slug(name) || 'new'}-${Math.random().toString(36).slice(2, 6)}`; }
    function defaultDate() { const items = sortedItems(D); return items.length ? items[items.length - 1].date : ''; }
    function setEditing(on) {
      editing = on;
      document.body.classList.toggle('editing', on);
      editbar.hidden = !on;
      if (on) {
        editbar.innerHTML = '<div class="editbar-inner"><span class="label status">Editing \u00b7 saved in this browser</span><div class="actions">' +
          '<button type="button" class="btn primary" data-action="toggle-edit">Done</button>' +
          '<button type="button" class="btn" data-action="export-html">Export HTML</button>' +
          '<button type="button" class="btn" data-action="export-json">Export JSON</button>' +
          '<button type="button" class="btn" data-action="import-json">Import JSON</button>' +
          '<button type="button" class="btn danger" data-action="discard">Discard edits</button></div></div>';
      } else {
        if (saveTimer) saveNow();
        renderPages();
      }
      applyRoute();
    }
    function download(name, content, type) {
      const url = URL.createObjectURL(new Blob([content], { type }));
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
    function fileBase() { return slug((D.trip.traveler || '') + ' ' + (D.trip.title || 'trip briefing')) || 'trip-briefing'; }
    function exportHTML() {
      if (saveTimer) saveNow();
      const startAt = SHELL.indexOf(PAGES_START);
      const endAt = SHELL.indexOf(PAGES_END);
      if (startAt < 0 || endAt < 0) { alert('Export failed: page markers not found.'); return; }
      let html = SHELL.slice(0, startAt + PAGES_START.length) + renderStaticPages(D) + SHELL.slice(endAt);
      html = html.replace(/<html[^>]*>/, '<html lang="en">');
      html = html.replace(/(<script id="trip-data" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + safeJSON(D) + b);
      download(fileBase() + '.html', '<!doctype html>\n' + html, 'text/html');
    }

    document.addEventListener('input', (e) => {
      const el = e.target.closest && e.target.closest('[data-e]');
      if (!el) return;
      const ent = entity(el.dataset.e, el.dataset.id);
      if (!ent) return;
      ent[el.dataset.k] = el.value;
      scheduleSave();
    });
    document.addEventListener('change', (e) => {
      const el = e.target;
      if (!el.matches || !el.matches('input[type=checkbox][data-attendee]')) return;
      const m = byId(D.items, el.dataset.attendee);
      if (!m) return;
      const set = new Set(m.attendees || []);
      if (el.checked) set.add(el.value); else set.delete(el.value);
      m.attendees = Array.from(set);
      scheduleSave();
    });
    document.addEventListener('click', (e) => {
      const b = e.target.closest && e.target.closest('[data-action]');
      if (!b) return;
      e.preventDefault();
      const action = b.dataset.action;
      if (action === 'lock') { forgetKey(); location.hash = ''; location.reload(); return; }
      if (PROTECTED) return;
      if (action === 'toggle-edit') { setEditing(!editing); return; }
      if (action === 'export-html') { exportHTML(); return; }
      if (action === 'export-json') { if (saveTimer) saveNow(); download(fileBase() + '.json', JSON.stringify(D, null, 2), 'application/json'); return; }
      if (action === 'import-json') { fileEl.value = ''; fileEl.click(); return; }
      if (action === 'discard') {
        if (!confirm('Discard all edits made in this browser and return to the version stored in this file?')) return;
        clearTimeout(saveTimer);
        saveTimer = null;
        try { localStorage.removeItem(STORAGE_KEY); } catch (err) { /* nothing stored */ }
        D = JSON.parse(JSON.stringify(EMBEDDED));
        D.meta = D.meta || {};
        usingDraft = false;
        renderPages();
        applyRoute();
        return;
      }
      if (action === 'add-meeting' || action === 'add-travel') {
        const kind = action === 'add-meeting' ? 'meeting' : 'travel';
        const item = kind === 'meeting'
          ? { id: newId('m', 'meeting'), kind, date: defaultDate(), start: '', end: '', title: 'New meeting', accountId: '', city: '', meetingType: '', venue: '', address: '', factoryTeam: '', attendees: [] }
          : { id: newId('t', 'travel'), kind, date: defaultDate(), start: '', end: '', title: 'New travel item', detail: '', address: '' };
        D.items.push(item);
        saveNow(); renderPages(); navigate(`#${kind}-${item.id}`);
        return;
      }
      if (action === 'add-account') {
        const a = { id: newId('a', 'account'), name: 'New account' };
        D.accounts.push(a);
        saveNow(); renderPages(); navigate(`#account-${a.id}`);
        return;
      }
      if (action === 'add-person') {
        const m = b.dataset.meeting ? byId(D.items, b.dataset.meeting) : null;
        const p = { id: newId('p', 'person'), name: 'New person', accountId: (m ? m.accountId : b.dataset.account) || '' };
        D.people.push(p);
        if (m) m.attendees = (m.attendees || []).concat(p.id);
        saveNow(); renderPages(); navigate(`#person-${p.id}`);
        return;
      }
      if (action === 'delete') {
        const type = b.dataset.type;
        const id = b.dataset.id;
        const ent = entity(type, id);
        if (!ent || !confirm(`Delete "${ent.title || ent.name || 'this item'}"? This cannot be undone.`)) return;
        let dest = '#schedule';
        if (type === 'meeting' || type === 'travel') D.items = D.items.filter((i) => i.id !== id);
        if (type === 'account') {
          D.accounts = D.accounts.filter((a) => a.id !== id);
          D.people.forEach((p) => { if (p.accountId === id) p.accountId = ''; });
          D.items.forEach((i) => { if (i.accountId === id) i.accountId = ''; });
          dest = '#accounts';
        }
        if (type === 'person') {
          D.people = D.people.filter((p) => p.id !== id);
          D.items.forEach((i) => { if (i.attendees) i.attendees = i.attendees.filter((x) => x !== id); });
          dest = '#people';
        }
        saveNow(); renderPages(); navigate(dest);
      }
    });
    fileEl.addEventListener('change', () => {
      const f = fileEl.files && fileEl.files[0];
      if (!f) return;
      f.text().then((txt) => {
        const next = JSON.parse(txt);
        if (!next || !next.trip || !Array.isArray(next.items) || !Array.isArray(next.accounts) || !Array.isArray(next.people)) throw new Error('Missing trip, items, accounts or people.');
        D = next;
        D.meta = D.meta || {};
        saveNow(); renderPages(); applyRoute();
      }).catch((err) => alert('Import failed: ' + err.message));
    });
    qEl.addEventListener('input', () => {
      const q = qEl.value.trim().toLowerCase();
      if (!q) { applyRoute(false); return; }
      pagesEl.hidden = true;
      editorEl.hidden = true;
      searchEl.hidden = false;
      searchEl.innerHTML = renderSearch(D, q);
    });
    window.addEventListener('hashchange', () => { qEl.value = ''; applyRoute(); });
    window.addEventListener('pagehide', () => { if (saveTimer) saveNow(); });

    renderPages();
    applyRoute(false);
  }

  // ---------- password unlock (protected build) ----------
  const KEY_STORE = 'factory-trip-briefing:key:v1';
  const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64e = (u8) => { let s = ''; u8.forEach((b) => { s += String.fromCharCode(b); }); return btoa(s); };
  async function decryptWith(key, box) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(box.iv) }, key, b64d(box.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function deriveKey(password, box) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(box.salt), iterations: box.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  function forgetKey() { try { localStorage.removeItem(KEY_STORE); } catch (err) { /* nothing stored */ } }
  function unlock(box, done) {
    const lock = document.getElementById('lock');
    const form = document.getElementById('lock-form');
    const input = document.getElementById('lock-pass');
    const remember = document.getElementById('lock-remember');
    const msg = document.getElementById('lock-msg');
    const btn = form.querySelector('button[type=submit]');
    document.body.classList.add('locked');
    const finish = (data) => { document.body.classList.remove('locked'); lock.hidden = true; done(data); };
    const show = () => { lock.hidden = false; input.focus(); };
    if (!(window.crypto && crypto.subtle)) {
      show();
      btn.disabled = true;
      msg.textContent = 'This browser cannot unlock the briefing. Open the link in Safari or Chrome.';
      return;
    }
    let stored = null;
    try { stored = localStorage.getItem(KEY_STORE); } catch (err) { /* storage unavailable */ }
    const auto = stored
      ? crypto.subtle.importKey('raw', b64d(stored), 'AES-GCM', false, ['decrypt']).then((k) => decryptWith(k, box))
      : Promise.reject(new Error('no stored key'));
    auto.then(finish, () => {
      if (stored) forgetKey();
      show();
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        msg.textContent = 'Unlocking\u2026';
        try {
          const key = await deriveKey(input.value, box);
          const data = await decryptWith(key, box);
          if (remember.checked) {
            try { localStorage.setItem(KEY_STORE, b64e(new Uint8Array(await crypto.subtle.exportKey('raw', key)))); } catch (err) { /* not remembered */ }
          }
          input.value = '';
          msg.textContent = '';
          finish(data);
        } catch (err) {
          msg.textContent = 'Wrong password. Try again.';
          input.select();
        } finally {
          btn.disabled = false;
        }
      });
    });
  }

  if (typeof document !== 'undefined') {
    const start = (data, mode) => {
      try { boot(data, mode); } catch (err) {
        document.documentElement.classList.remove('js');
        console.error(err);
      }
    };
    const enc = document.getElementById('trip-data-encrypted');
    if (enc) unlock(JSON.parse(enc.textContent), (data) => start(data, 'protected'));
    else start(JSON.parse(document.getElementById('trip-data').textContent), 'open');
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
</body>
</html>
